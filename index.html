<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>바코드 스캐너 (안정 + 사진 스캔)</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 16px;
    }
    h1 {
      text-align: center;
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: #38bdf8;
    }
    #reader {
      width: 100%;
      max-width: 480px;
      margin: 0 auto 12px;
      border-radius: 12px;
      overflow: hidden;
      background: #1e293b;
      min-height: 260px;
    }
    #result-box {
      max-width: 480px;
      margin: 0 auto;
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      display: none;
    }
    #result-box h2 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: #4ade80;
    }
    .code {
      font-size: 1.2rem;
      font-weight: 700;
      word-break: break-all;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      color: #fbbf24;
    }
    .product-info {
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .product-info img {
      max-width: 140px;
      border-radius: 8px;
      margin: 8px 0;
      display: block;
      background: #fff;
    }
    .product-info p { margin-bottom: 6px; }
    .btn {
      display: block;
      width: 100%;
      max-width: 480px;
      margin: 10px auto 0;
      padding: 14px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:active { opacity: 0.85; }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-warning {
      background: #f59e0b;
      color: #0f172a;
    }
    .btn-green {
      background: #22c55e;
      color: #0f172a;
    }
    .hint {
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 12px;
      line-height: 1.5;
    }
    .loading {
      text-align: center;
      color: #94a3b8;
      padding: 12px 0;
    }
    .source {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 10px;
    }
    .tip {
      background: #1e293b;
      border-left: 4px solid #fbbf24;
      padding: 12px;
      margin: 0 auto 14px;
      max-width: 480px;
      font-size: 0.9rem;
      border-radius: 0 8px 8px 0;
      color: #fde68a;
      line-height: 1.5;
    }
    #file-input {
      display: none;
    }
  </style>
</head>
<body>
  <h1>📱 바코드 / QR 스캐너</h1>

  <div class="tip">
    <strong>작은 바코드가 잘 안 읽힐 때</strong><br>
    → 아래 <b>「사진으로 스캔」</b> 버튼을 사용하세요<br>
    핸드폰 기본 카메라로 선명하게 찍은 뒤 선택하면 잘 읽힙니다
  </div>
  
  <div id="reader"></div>
  
  <div id="result-box">
    <h2>스캔 결과</h2>
    <div class="code" id="decoded-text"></div>
    <div id="product-info" class="product-info"></div>
    <button class="btn" id="rescanBtn">다시 스캔하기</button>
  </div>

  <!-- 카메라 사용 중 버튼들 -->
  <button class="btn btn-green" id="photoBtn">사진으로 스캔 (작은 바코드 추천)</button>
  <button class="btn btn-warning" id="refocusBtn" style="display:none;">카메라 다시 시작</button>
  <button class="btn btn-secondary" id="torchBtn" style="display:none;">플래시 켜기/끄기</button>

  <input type="file" id="file-input" accept="image/*" capture="environment">

  <p class="hint">
    실시간 카메라 스캔 + 사진 스캔 지원<br>
    작은 바코드는 「사진으로 스캔」을 사용하세요
  </p>

  <script>
    let html5QrCode = null;
    let isScanning = false;
    let torchOn = false;
    let isBusy = false;

    // 버튼 이벤트
    document.getElementById("rescanBtn").addEventListener("click", () => {
      startCameraScan();
    });

    document.getElementById("refocusBtn").addEventListener("click", () => {
      startCameraScan();
    });

    document.getElementById("torchBtn").addEventListener("click", () => {
      toggleTorch();
    });

    document.getElementById("photoBtn").addEventListener("click", () => {
      document.getElementById("file-input").click();
    });

    document.getElementById("file-input").addEventListener("change", (e) => {
      if (e.target.files && e.target.files.length > 0) {
        scanFromFile(e.target.files[0]);
      }
    });

    function onScanSuccess(decodedText) {
      if (!isScanning) return;
      isScanning = false;

      stopCamera().then(() => {
        showResult(decodedText);
      });
    }

    function showResult(decodedText) {
      document.getElementById("reader").style.display = "none";
      document.getElementById("refocusBtn").style.display = "none";
      document.getElementById("torchBtn").style.display = "none";
      document.getElementById("photoBtn").style.display = "none";

      document.getElementById("result-box").style.display = "block";
      document.getElementById("decoded-text").textContent = decodedText;
      document.getElementById("product-info").innerHTML = '<div class="loading">제품 정보 조회 중...</div>';

      fetchProductInfo(decodedText);
    }

    async function fetchProductInfo(barcode) {
      const infoDiv = document.getElementById("product-info");

      if (!/^\d{8,14}$/.test(barcode)) {
        infoDiv.innerHTML = "<p>일반 텍스트 또는 QR 코드입니다.<br>제품 데이터베이스에서 조회할 수 없습니다.</p>";
        return;
      }

      try {
        const url = `https://world.openfoodfacts.org/api/v2/product/${barcode}?product_type=all&fields=product_name,product_name_en,brands,quantity,categories,ingredients_text,image_front_small_url,image_url,product_type,countries,labels`;
        
        const res = await fetch(url, {
          headers: { "User-Agent": "BarcodeScannerApp/1.0 (Vercel Demo)" }
        });

        const data = await res.json();

        if (data.status === 1 && data.product) {
          const p = data.product;
          let html = "";

          const img = p.image_front_small_url || p.image_url;
          if (img) {
            html += `<img src="${img}" alt="제품 이미지" onerror="this.style.display='none'">`;
          }

          const name = p.product_name || p.product_name_en || "이름 정보 없음";
          html += `<p><strong>제품명:</strong> ${name}</p>`;

          if (p.brands) html += `<p><strong>브랜드:</strong> ${p.brands}</p>`;
          if (p.quantity) html += `<p><strong>용량/수량:</strong> ${p.quantity}</p>`;

          if (p.categories) {
            const cat = p.categories.split(",")[0].trim();
            html += `<p><strong>카테고리:</strong> ${cat}</p>`;
          }

          if (p.product_type) {
            const typeMap = {
              food: "식품",
              beauty: "화장품/뷰티",
              petfood: "반려동물 식품",
              product: "일반 제품"
            };
            html += `<p><strong>유형:</strong> ${typeMap[p.product_type] || p.product_type}</p>`;
          }

          if (p.ingredients_text) {
            const short = p.ingredients_text.length > 150 
              ? p.ingredients_text.substring(0, 150) + "..." 
              : p.ingredients_text;
            html += `<p><strong>원재료/성분:</strong> ${short}</p>`;
          }

          if (p.labels) html += `<p><strong>라벨:</strong> ${p.labels}</p>`;
          if (p.countries) html += `<p><strong>판매 국가:</strong> ${p.countries}</p>`;

          html += `<div class="source">데이터 출처: Open Food / Beauty / Products Facts</div>`;
          infoDiv.innerHTML = html;
        } else {
          infoDiv.innerHTML = `
            <p>이 바코드에 대한 제품 정보를 찾을 수 없습니다.</p>
            <p style="margin-top:8px; font-size:0.9rem; color:#94a3b8;">
              • 데이터베이스에 아직 등록되지 않은 제품일 수 있습니다<br>
              • 일부 전자기기·의류·의약품 등은 정보가 적을 수 있습니다
            </p>
          `;
        }
      } catch (err) {
        console.error(err);
        infoDiv.innerHTML = `
          <p>제품 정보 조회 중 오류가 발생했습니다.</p>
          <p style="font-size:0.9rem; color:#94a3b8;">인터넷 연결을 확인해 주세요.</p>
        `;
      }
    }

    // 카메라 완전히 중지
    function stopCamera() {
      return new Promise((resolve) => {
        if (!html5QrCode) {
          isScanning = false;
          resolve();
          return;
        }

        html5QrCode.stop()
          .then(() => {
            try { html5QrCode.clear(); } catch(e) {}
            html5QrCode = null;
            isScanning = false;
            resolve();
          })
          .catch(() => {
            try { html5QrCode.clear(); } catch(e) {}
            html5QrCode = null;
            isScanning = false;
            resolve();
          });
      });
    }

    // 실시간 카메라 스캔 시작
    async function startCameraScan() {
      if (isBusy) return;
      isBusy = true;

      try {
        // 기존 카메라 종료
        await stopCamera();

        // UI 초기화
        document.getElementById("reader").innerHTML = "";
        document.getElementById("reader").style.display = "block";
        document.getElementById("result-box").style.display = "none";
        document.getElementById("photoBtn").style.display = "block";
        document.getElementById("refocusBtn").style.display = "block";
        document.getElementById("torchBtn").style.display = "none";
        torchOn = false;

        // 카메라 리소스 해제 대기 (중요)
        await new Promise(r => setTimeout(r, 500));

        html5QrCode = new Html5Qrcode("reader");
        isScanning = true;

        const config = {
          fps: 12,
          qrbox: { width: 240, height: 120 },
          aspectRatio: 1.777,
          experimentalFeatures: {
            useBarCodeDetectorIfSupported: true
          },
          videoConstraints: {
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };

        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          onScanSuccess,
          () => {}
        );

        // 플래시 지원 확인
        setTimeout(() => {
          try {
            const caps = html5QrCode.getRunningTrackCameraCapabilities();
            if (caps && caps.torchFeature && caps.torchFeature().isSupported()) {
              document.getElementById("torchBtn").style.display = "block";
            }
          } catch (e) {}
        }, 1000);

      } catch (err) {
        console.error("카메라 시작 실패:", err);
        alert("카메라를 시작할 수 없습니다.\n페이지를 새로고침 한 뒤 다시 시도해 주세요.\n\n" + (err.message || err));
        isScanning = false;
      }

      isBusy = false;
    }

    // 사진 파일로 스캔 (작은 바코드에 효과적)
    async function scanFromFile(file) {
      if (isBusy) return;
      isBusy = true;

      try {
        await stopCamera();

        document.getElementById("reader").style.display = "none";
        document.getElementById("refocusBtn").style.display = "none";
        document.getElementById("torchBtn").style.display = "none";
        document.getElementById("photoBtn").style.display = "none";
        document.getElementById("result-box").style.display = "block";
        document.getElementById("decoded-text").textContent = "사진 분석 중...";
        document.getElementById("product-info").innerHTML = '<div class="loading">바코드를 읽는 중입니다...</div>';

        // 파일 스캔용 임시 인스턴스
        const fileScanner = new Html5Qrcode("reader");
        
        const decodedText = await fileScanner.scanFile(file, true);
        
        // 성공
        document.getElementById("decoded-text").textContent = decodedText;
        document.getElementById("product-info").innerHTML = '<div class="loading">제품 정보 조회 중...</div>';
        fetchProductInfo(decodedText);

      } catch (err) {
        console.error("파일 스캔 실패:", err);
        document.getElementById("decoded-text").textContent = "인식 실패";
        document.getElementById("product-info").innerHTML = `
          <p>사진에서 바코드를 찾지 못했습니다.</p>
          <p style="margin-top:8px; font-size:0.9rem; color:#94a3b8;">
            • 바코드가 선명하게 나오도록 가까이서 찍어주세요<br>
            • 빛이 충분한 곳에서 찍어주세요<br>
            • 바코드가 기울어지지 않게 찍어주세요
          </p>
        `;
      }

      // 파일 input 초기화 (같은 파일 다시 선택 가능하도록)
      document.getElementById("file-input").value = "";
      isBusy = false;
    }

    function toggleTorch() {
      try {
        const caps = html5QrCode.getRunningTrackCameraCapabilities();
        if (caps && caps.torchFeature && caps.torchFeature().isSupported()) {
          torchOn = !torchOn;
          caps.torchFeature().apply(torchOn);
          document.getElementById("torchBtn").textContent = torchOn ? "플래시 끄기" : "플래시 켜기";
        }
      } catch (e) {
        alert("이 기기에서는 플래시를 사용할 수 없습니다.");
      }
    }

    // 페이지 로드 시 카메라 시작
    window.addEventListener("load", () => {
      startCameraScan();
    });
  </script>
</body>
</html>
