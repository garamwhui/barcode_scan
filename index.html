<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>바코드 스캐너</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 16px;
    }
    h1 {
      text-align: center;
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: #38bdf8;
    }
    #reader {
      width: 100%;
      max-width: 480px;
      margin: 0 auto 12px;
      border-radius: 12px;
      overflow: hidden;
      background: #1e293b;
      min-height: 260px;
    }
    #result-box {
      max-width: 480px;
      margin: 0 auto;
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      display: none;
    }
    #result-box h2 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: #4ade80;
    }
    .code {
      font-size: 1.15rem;
      font-weight: 700;
      word-break: break-all;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      color: #fbbf24;
    }
    .product-info {
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .product-info img {
      max-width: 140px;
      border-radius: 8px;
      margin: 8px 0;
      display: block;
      background: #fff;
    }
    .product-info p { margin-bottom: 6px; }
    .btn {
      display: block;
      width: 100%;
      max-width: 480px;
      margin: 8px auto 0;
      padding: 13px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:active { opacity: 0.85; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-warning { background: #f59e0b; color: #0f172a; }
    .btn-green { background: #22c55e; color: #0f172a; }
    .btn-copy { background: #6366f1; color: #fff; }
    .btn-search { background: #0ea5e9; color: #fff; }
    .btn-shop { background: #64748b; color: #fff; font-size: 0.9rem; padding: 11px; }
    .hint {
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 12px;
      line-height: 1.5;
    }
    .loading {
      text-align: center;
      color: #94a3b8;
      padding: 12px 0;
    }
    .source {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 10px;
    }
    .tip {
      background: #1e293b;
      border-left: 4px solid #fbbf24;
      padding: 12px;
      margin: 0 auto 14px;
      max-width: 480px;
      font-size: 0.9rem;
      border-radius: 0 8px 8px 0;
      color: #fde68a;
      line-height: 1.5;
    }
    .warning-box {
      background: #7f1d1d;
      border: 1px solid #ef4444;
      color: #fecaca;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .action-group {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #334155;
    }
    .action-group h3 {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .shop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    #file-input { display: none; }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #22c55e;
      color: #0f172a;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      z-index: 999;
      display: none;
    }
  </style>
</head>
<body>
  <h1>📱 바코드 / QR 스캐너</h1>

  <div class="tip">
    <strong>작은 바코드가 잘 안 읽힐 때</strong><br>
    → <b>「사진으로 스캔」</b> 버튼을 사용하세요<br>
    핸드폰 기본 카메라로 선명하게 찍은 뒤 선택하면 잘 읽힙니다
  </div>
  
  <div id="reader"></div>
  
  <div id="result-box">
    <h2>스캔 결과</h2>

    <!-- 스캔 결과 (항상 텍스트로 표시) -->
    <div class="code" id="decoded-text"></div>

    <!-- 웹사이트일 때만 보이는 접속 버튼 -->
    <button class="btn btn-green" id="openUrlBtn" style="display:none; margin-bottom:10px;">
      🌐 웹사이트 접속하기
    </button>

    <div id="product-info" class="product-info"></div>

    <!-- 액션 버튼들 -->
    <div class="action-group" id="action-buttons" style="display:none;">
      <button class="btn btn-copy" id="copyBtn">📋 바코드 복사</button>
      <button class="btn btn-search" id="googleBtn">🔍 구글에서 검색</button>

      <h3 style="margin-top:14px;">쇼핑 검색</h3>
      <div class="shop-grid">
        <button class="btn btn-shop" id="gshopBtn">구글 쇼핑</button>
        <button class="btn btn-shop" id="coupangBtn">쿠팡</button>
        <button class="btn btn-shop" id="daisoBtn">다이소</button>
        <button class="btn btn-shop" id="naverBtn">네이버</button>
      </div>
    </div>

    <button class="btn" id="rescanBtn" style="margin-top:14px;">다시 스캔하기</button>
  </div>

  <button class="btn btn-green" id="photoBtn">사진으로 스캔 (작은 바코드 추천)</button>
  <button class="btn btn-warning" id="refocusBtn" style="display:none;">카메라 다시 시작</button>
  <button class="btn btn-secondary" id="torchBtn" style="display:none;">플래시 켜기/끄기</button>

  <input type="file" id="file-input" accept="image/*" capture="environment">

  <p class="hint">
    실시간 카메라 스캔 + 사진 스캔 지원<br>
    식품 · 화장품 · 생활용품 · 반려동물용품 등<br>
    바코드 국가 코드와 제품 정보가 다르면 경고를 표시합니다
  </p>

  <div class="toast" id="toast">복사되었습니다!</div>

  <script>
    let html5QrCode = null;
    let isScanning = false;
    let torchOn = false;
    let isBusy = false;
    let currentBarcode = "";

    // 바코드 앞자리 → 국가

        "410":"독일","411":"독일","412":"독일","413":"독일","414":"독일","415":"독일","416":"독일","417":"독일","418":"독일","419":"독일",
        "420":"독일","421":"독일","422":"독일","423":"독일","424":"독일","425":"독일","426":"독일","427":"독일","428":"독일","429":"독일",
        "430":"독일","431":"독일","432":"독일","433":"독일","434":"독일","435":"독일","436":"독일","437":"독일","438":"독일","439":"독일","440":"독일",
        "500":"영국","501":"영국","502":"영국","503":"영국","504":"영국","505":"영국","506":"영국","507":"영국","508":"영국","509":"영국",
        "300":"프랑스","301":"프랑스","302":"프랑스","303":"프랑스","304":"프랑스","305":"프랑스","306":"프랑스","307":"프랑스","308":"프랑스","309":"프랑스",
        "310":"프랑스","311":"프랑스","312":"프랑스","313":"프랑스","314":"프랑스","315":"프랑스","316":"프랑스","317":"프랑스","318":"프랑스","319":"프랑스",
        "320":"프랑스","321":"프랑스","322":"프랑스","323":"프랑스","324":"프랑스","325":"프랑스","326":"프랑스","327":"프랑스","328":"프랑스","329":"프랑스",
        "330":"프랑스","331":"프랑스","332":"프랑스","333":"프랑스","334":"프랑스","335":"프랑스","336":"프랑스","337":"프랑스","338":"프랑스","339":"프랑스",
        "340":"프랑스","341":"프랑스","342":"프랑스","343":"프랑스","344":"프랑스","345":"프랑스","346":"프랑스","347":"프랑스","348":"프랑스","349":"프랑스",
        "350":"프랑스","351":"프랑스","352":"프랑스","353":"프랑스","354":"프랑스","355":"프랑스","356":"프랑스","357":"프랑스","358":"프랑스","359":"프랑스",
        "360":"프랑스","361":"프랑스","362":"프랑스","363":"프랑스","364":"프랑스","365":"프랑스","366":"프랑스","367":"프랑스","368":"프랑스","369":"프랑스",
        "370":"프랑스","371":"프랑스","372":"프랑스","373":"프랑스","374":"프랑스","375":"프랑스","376":"프랑스","377":"프랑스","378":"프랑스","379":"프랑스",
        "870":"네덜란드","871":"네덜란드","872":"네덜란드","873":"네덜란드","874":"네덜란드","875":"네덜란드","876":"네덜란드","877":"네덜란드","878":"네덜란드","879":"네덜란드",
        "930":"호주","931":"호주","932":"호주","933":"호주","934":"호주","935":"호주","936":"호주","937":"호주","938":"호주","939":"호주",
        "940":"뉴질랜드","941":"뉴질랜드","942":"뉴질랜드","943":"뉴질랜드","944":"뉴질랜드","945":"뉴질랜드","946":"뉴질랜드","947":"뉴질랜드","948":"뉴질랜드","949":"뉴질랜드",
        "471":"대만","489":"홍콩","885":"태국","888":"싱가포르","893":"베트남","899":"인도네시아",
        "628": "사우디아라비아",
        "529": "키프로스",
        "560": "포르투갈",
        "590": "폴란드",
        "594": "루마니아",
        "599": "헝가리",

        "601": "남아프리카",

        "800":"이탈리아","801":"이탈리아","802":"이탈리아","803":"이탈리아","804":"이탈리아","805":"이탈리아","806":"이탈리아","807":"이탈리아","808":"이탈리아","809":"이탈리아",
        "810":"이탈리아","811":"이탈리아","812":"이탈리아","813":"이탈리아","814":"이탈리아","815":"이탈리아","816":"이탈리아","817":"이탈리아","818":"이탈리아","819":"이탈리아",
        "820":"이탈리아","821":"이탈리아","822":"이탈리아","823":"이탈리아","824":"이탈리아","825":"이탈리아","826":"이탈리아","827":"이탈리아","828":"이탈리아","829":"이탈리아",
        "840":"스페인","841":"스페인","842":"스페인","843":"스페인","844":"스페인","845":"스페인","846":"스페인","847":"스페인","848":"스페인","849":"스페인"
      };
      if (map[p3]) return map[p3];
      if (barcode.startsWith("0")) return "미국/캐나다";
      return "알 수 없음";
    }

    function isCountryMismatch(barcodeCountry, dbCountries) {
      if (!barcodeCountry || barcodeCountry === "알 수 없음" || !dbCountries) return false;
      const db = dbCountries.toLowerCase();
      const keywords = {
        "한국": ["korea","south korea","대한민국","한국"],
        "일본": ["japan","일본"],
        "중국": ["china","중국"],
        "미국/캐나다": ["united states","usa","america","canada","미국","캐나다"],
        "독일": ["germany","독일"],
        "영국": ["united kingdom","uk","great britain","영국"],
        "프랑스": ["france","프랑스"],
        "이탈리아": ["italy","이탈리아"],
        "스페인": ["spain","스페인"],
        "네덜란드": ["netherlands","네덜란드"],
        "호주": ["australia","호주"],
        "뉴질랜드": ["new zealand","뉴질랜드"],
        "대만": ["taiwan","대만"],
        "홍콩": ["hong kong","홍콩"]
      };
      const list = keywords[barcodeCountry] || [barcodeCountry.toLowerCase()];
      for (const key of list) {
        if (db.includes(key)) return false;
      }
      return true;
    }

    // 웹사이트 주소인지 확인
    function isUrl(text) {
      if (!text) return false;
      return /^https?:\/\/\S+/i.test(text.trim());
    }

    // 토스트 메시지
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 1800);
    }

    // 버튼 이벤트
    document.getElementById("rescanBtn").addEventListener("click", () => startCameraScan());
    document.getElementById("refocusBtn").addEventListener("click", () => startCameraScan());
    document.getElementById("torchBtn").addEventListener("click", () => toggleTorch());
    document.getElementById("photoBtn").addEventListener("click", () => {
      document.getElementById("file-input").click();
    });
    document.getElementById("file-input").addEventListener("change", (e) => {
      if (e.target.files && e.target.files.length > 0) {
        scanFromFile(e.target.files[0]);
      }
    });

    // 웹사이트 접속 버튼
    document.getElementById("openUrlBtn").addEventListener("click", () => {
      if (currentBarcode && isUrl(currentBarcode)) {
        window.open(currentBarcode.trim(), "_blank");
      }
    });

    // 복사 / 검색 버튼
    document.getElementById("copyBtn").addEventListener("click", () => {
      if (!currentBarcode) return;
      navigator.clipboard.writeText(currentBarcode).then(() => {
        showToast("복사되었습니다!");
      }).catch(() => {
        const ta = document.createElement("textarea");
        ta.value = currentBarcode;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("복사되었습니다!");
      });
    });

    document.getElementById("googleBtn").addEventListener("click", () => {
      if (!currentBarcode) return;
      window.open(`https://www.google.com/search?q=${encodeURIComponent(currentBarcode)}`, "_blank");
    });

    document.getElementById("gshopBtn").addEventListener("click", () => {
      if (!currentBarcode) return;
      window.open(`https://www.google.com/search?tbm=shop&q=${encodeURIComponent(currentBarcode)}`, "_blank");
    });

    document.getElementById("coupangBtn").addEventListener("click", () => {
      if (!currentBarcode) return;
      window.open(`https://www.coupang.com/np/search?q=${encodeURIComponent(currentBarcode)}`, "_blank");
    });

    document.getElementById("daisoBtn").addEventListener("click", () => {
      if (!currentBarcode) return;
      window.open(`https://prdm.daisomall.co.kr/ssn/search/FindStoreGoods?searchTerm=${encodeURIComponent(currentBarcode)}&cntPerPage=30&pageNum=1`, "_blank");
    });

    document.getElementById("naverBtn").addEventListener("click", () => {
      if (!currentBarcode) return;
      window.open(`https://search.naver.com/search.naver?query=${encodeURIComponent(currentBarcode)}`, "_blank");
    });

    function onScanSuccess(decodedText) {
      if (!isScanning) return;
      isScanning = false;
      stopCamera().then(() => showResult(decodedText));
    }

    function showResult(decodedText) {
      currentBarcode = decodedText;

      document.getElementById("reader").style.display = "none";
      document.getElementById("refocusBtn").style.display = "none";
      document.getElementById("torchBtn").style.display = "none";
      document.getElementById("photoBtn").style.display = "none";

      document.getElementById("result-box").style.display = "block";

      // 스캔 결과는 항상 원본 그대로 텍스트로 표시
      document.getElementById("decoded-text").textContent = decodedText;

      // 웹사이트 주소이면 접속 버튼 표시
      const openBtn = document.getElementById("openUrlBtn");
      if (isUrl(decodedText)) {
        openBtn.style.display = "block";
      } else {
        openBtn.style.display = "none";
      }

      document.getElementById("product-info").innerHTML = '<div class="loading">제품 정보 조회 중...</div>';
      document.getElementById("action-buttons").style.display = "block";

      fetchProductInfo(decodedText);
    }

    async function fetchProductInfo(barcode) {
      const infoDiv = document.getElementById("product-info");
      const barcodeCountry = getCountryFromBarcode(barcode);

      // URL이거나 숫자가 아니면 제품 검색 생략
      if (!/^\d{8,14}$/.test(barcode)) {
        if (isUrl(barcode)) {
          infoDiv.innerHTML = "<p>웹사이트 주소가 스캔되었습니다.<br>위 「웹사이트 접속하기」 버튼을 눌러 이동하세요.</p>";
        } else {
          infoDiv.innerHTML = "<p>일반 텍스트 또는 QR 코드입니다.<br>아래 버튼으로 검색해 보세요.</p>";
        }
        return;
      }

      try {
        const url = `https://world.openfoodfacts.org/api/v2/product/${barcode}?product_type=all&fields=product_name,product_name_en,brands,quantity,categories,ingredients_text,image_front_small_url,image_url,product_type,countries,labels`;
        
        const res = await fetch(url, {
          headers: { "User-Agent": "BarcodeScannerApp/1.0 (Vercel Demo)" }
        });

        const data = await res.json();

        if (data.status === 1 && data.product) {
          const p = data.product;
          let html = "";

          if (isCountryMismatch(barcodeCountry, p.countries)) {
            html += `
              <div class="warning-box">
                ⚠️ <strong>국가 정보가 일치하지 않습니다</strong><br>
                바코드 등록 국가: <b>${barcodeCountry}</b><br>
                데이터베이스 판매/등록 국가: <b>${p.countries || "정보 없음"}</b><br><br>
                실제 제품과 다른 정보가 나왔을 수 있습니다.<br>
                직접 확인해 주세요.
              </div>
            `;
          }

          const img = p.image_front_small_url || p.image_url;
          if (img) {
            html += `<img src="${img}" alt="제품 이미지" onerror="this.style.display='none'">`;
          }

          const name = p.product_name || p.product_name_en || "이름 정보 없음";
          html += `<p><strong>제품명:</strong> ${name}</p>`;

          if (p.brands) html += `<p><strong>브랜드:</strong> ${p.brands}</p>`;
          if (p.quantity) html += `<p><strong>용량/수량:</strong> ${p.quantity}</p>`;

          if (p.categories) {
            const cat = p.categories.split(",")[0].trim();
            html += `<p><strong>카테고리:</strong> ${cat}</p>`;
          }

          if (p.product_type) {
            const typeMap = { food:"식품", beauty:"화장품/뷰티", petfood:"반려동물 식품", product:"일반 제품" };
            html += `<p><strong>유형:</strong> ${typeMap[p.product_type] || p.product_type}</p>`;
          }

          html += `<p><strong>바코드 등록 국가:</strong> ${barcodeCountry}</p>`;
          if (p.countries) html += `<p><strong>DB 판매/등록 국가:</strong> ${p.countries}</p>`;

          if (p.ingredients_text) {
            const short = p.ingredients_text.length > 150 ? p.ingredients_text.substring(0, 150) + "..." : p.ingredients_text;
            html += `<p><strong>원재료/성분:</strong> ${short}</p>`;
          }

          if (p.labels) html += `<p><strong>라벨:</strong> ${p.labels}</p>`;
          html += `<div class="source">데이터 출처: Open Food / Beauty / Products Facts</div>`;
          infoDiv.innerHTML = html;
        } else {
          infoDiv.innerHTML = `
            <p>이 바코드에 대한 제품 정보를 찾을 수 없습니다.</p>
            <p style="margin-top:8px; font-size:0.9rem; color:#94a3b8;">
              바코드 등록 국가: <b>${barcodeCountry}</b><br><br>
              • 데이터베이스에 아직 등록되지 않은 제품일 수 있습니다<br>
              • 아래 검색 버튼으로 직접 찾아보세요
            </p>
          `;
        }
      } catch (err) {
        console.error(err);
        infoDiv.innerHTML = `
          <p>제품 정보 조회 중 오류가 발생했습니다.</p>
          <p style="font-size:0.9rem; color:#94a3b8;">인터넷 연결을 확인해 주세요.</p>
        `;
      }
    }

    function stopCamera() {
      return new Promise((resolve) => {
        if (!html5QrCode) {
          isScanning = false;
          resolve();
          return;
        }
        html5QrCode.stop()
          .then(() => {
            try { html5QrCode.clear(); } catch(e) {}
            html5QrCode = null;
            isScanning = false;
            resolve();
          })
          .catch(() => {
            try { html5QrCode.clear(); } catch(e) {}
            html5QrCode = null;
            isScanning = false;
            resolve();
          });
      });
    }

    async function startCameraScan() {
      if (isBusy) return;
      isBusy = true;

      try {
        await stopCamera();

        document.getElementById("reader").innerHTML = "";
        document.getElementById("reader").style.display = "block";
        document.getElementById("result-box").style.display = "none";
        document.getElementById("action-buttons").style.display = "none";
        document.getElementById("openUrlBtn").style.display = "none";
        document.getElementById("photoBtn").style.display = "block";
        document.getElementById("refocusBtn").style.display = "block";
        document.getElementById("torchBtn").style.display = "none";
        torchOn = false;
        currentBarcode = "";

        await new Promise(r => setTimeout(r, 500));

        html5QrCode = new Html5Qrcode("reader");
        isScanning = true;

        const config = {
          fps: 12,
          qrbox: { width: 240, height: 120 },
          aspectRatio: 1.777,
          experimentalFeatures: { useBarCodeDetectorIfSupported: true },
          videoConstraints: {
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };

        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          onScanSuccess,
          () => {}
        );

        setTimeout(() => {
          try {
            const caps = html5QrCode.getRunningTrackCameraCapabilities();
            if (caps && caps.torchFeature && caps.torchFeature().isSupported()) {
              document.getElementById("torchBtn").style.display = "block";
            }
          } catch (e) {}
        }, 1000);

      } catch (err) {
        console.error("카메라 시작 실패:", err);
        alert("카메라를 시작할 수 없습니다.\n페이지를 새로고침 한 뒤 다시 시도해 주세요.\n\n" + (err.message || err));
        isScanning = false;
      }

      isBusy = false;
    }

    async function scanFromFile(file) {
      if (isBusy) return;
      isBusy = true;

      try {
        await stopCamera();

        document.getElementById("reader").style.display = "none";
        document.getElementById("refocusBtn").style.display = "none";
        document.getElementById("torchBtn").style.display = "none";
        document.getElementById("photoBtn").style.display = "none";
        document.getElementById("result-box").style.display = "block";
        document.getElementById("decoded-text").textContent = "사진 분석 중...";
        document.getElementById("product-info").innerHTML = '<div class="loading">바코드를 읽는 중입니다...</div>';
        document.getElementById("action-buttons").style.display = "none";
        document.getElementById("openUrlBtn").style.display = "none";

        const fileScanner = new Html5Qrcode("reader");
        const decodedText = await fileScanner.scanFile(file, true);
        
        currentBarcode = decodedText;
        document.getElementById("decoded-text").textContent = decodedText;

        // 웹사이트면 접속 버튼 표시
        if (isUrl(decodedText)) {
          document.getElementById("openUrlBtn").style.display = "block";
        } else {
          document.getElementById("openUrlBtn").style.display = "none";
        }

        document.getElementById("action-buttons").style.display = "block";
        document.getElementById("product-info").innerHTML = '<div class="loading">제품 정보 조회 중...</div>';
        fetchProductInfo(decodedText);

      } catch (err) {
        console.error("파일 스캔 실패:", err);
        document.getElementById("decoded-text").textContent = "인식 실패";
        document.getElementById("product-info").innerHTML = `
          <p>사진에서 바코드를 찾지 못했습니다.</p>
          <p style="margin-top:8px; font-size:0.9rem; color:#94a3b8;">
            • 바코드가 선명하게 나오도록 가까이서 찍어주세요<br>
            • 빛이 충분한 곳에서 찍어주세요
          </p>
        `;
      }

      document.getElementById("file-input").value = "";
      isBusy = false;
    }

    function toggleTorch() {
      try {
        const caps = html5QrCode.getRunningTrackCameraCapabilities();
        if (caps && caps.torchFeature && caps.torchFeature().isSupported()) {
          torchOn = !torchOn;
          caps.torchFeature().apply(torchOn);
          document.getElementById("torchBtn").textContent = torchOn ? "플래시 끄기" : "플래시 켜기";
        }
      } catch (e) {
        alert("이 기기에서는 플래시를 사용할 수 없습니다.");
      }
    }

    window.addEventListener("load", () => {
      startCameraScan();
    });
  </script>
</body>
</html>
